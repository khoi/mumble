[package]
name = "hex"
version = "3.3.0"
edition = "2024"
default-run = "hex"
license = "MIT"
repository = "https://github.com/anomalyco/hex"

[workspace]

[[test]]
name = "keyboard_layout"
harness = false

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Shipped executables carry no symbol table (about 11 MB on Linux). Panic
# backtraces lose function names; debug builds keep them.
[profile.release]
strip = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
cpal = "0.18.2"
ctrlc = "3.5.2"
data-encoding = "2.11.1"
dirs = "7.0.0"
fs2 = "0.4.3"
getrandom = "0.4.3"
hound = "3.5.1"
libc = "0.2.189"
oxc_allocator = "0.156.0"
oxc_ast = "0.156.0"
oxc_ast_visit = "0.156.0"
oxc_parser = "0.156.0"
oxc_span = "0.156.0"
regex = "1.13.1"
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tungstenite = { version = "0.30.0", features = ["native-tls"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
url = "2.5.8"
# Hex's HTTPS (`net`): model downloads, update checks, and transformation
# scripts' `fetch`, over the platform's TLS and trusted roots.
# `native-tls`, not `native-tls-no-default`: ureq 3.4 checks the former's
# name and panics on any https request without it.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6.1", default-features = false }
block2 = "0.6.2"
crossterm = "0.29.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
ratatui = "0.30.2"

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11-clipboard = "0.9.3"
x11rb = { version = "0.14.0", features = ["xkb", "xtest"] }
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "proxy"] }

# The desktop UI, compiled into every desktop build.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
pollster = "1.0.1"
# The local API's `/profile/vitals`; it reports nothing off macOS.
procwatch = { git = "https://github.com/anomalyco/rune.git", rev = "14bfef586b97bf1f964a0223d4195270d246c14f" }
rune = { git = "https://github.com/anomalyco/rune.git", rev = "14bfef586b97bf1f964a0223d4195270d246c14f", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "14bfef586b97bf1f964a0223d4195270d246c14f" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "14bfef586b97bf1f964a0223d4195270d246c14f" }
# The welcome hero's own GPU pass (`rune_ui::hero`); Rune's version.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
png = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-future = "0.3.2"

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
# shared: forbid; 346 errors left (t1003). Allowed, not warn: scripts/check runs clippy with -D warnings.
unsafe_code = "allow"

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
todo = "warn"
# shared-lints end
# shared: deny; 85 errors left (t1003). Allowed, not warn: scripts/check runs clippy with -D warnings.
disallowed_methods = "allow"
# shared: deny; 437 errors left (t1003)
let_underscore_must_use = "allow"
# shared: deny; 144 errors left (t1003)
undocumented_unsafe_blocks = "allow"
# shared: warn; 59 errors left under -D warnings (t1003)
expect_used = "allow"
# shared: warn; 41 errors left under -D warnings (t1003)
unwrap_used = "allow"

[lints]
workspace = true
