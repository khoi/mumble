name: MumbleMobile
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.kitlangton.hex
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: QC99C9JE59
    SWIFT_VERSION: 6.0
targets:
  MumbleMobile:
    type: application
    platform: iOS
    sources:
      - MumbleMobile
      - MumbleShared
      - MumbleActivity
      - path: ../app/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: MumbleKeyboard
        embed: true
      - target: MumbleWidgets
        embed: true
    info:
      path: MumbleMobile/Info.plist
      properties:
        CFBundleDisplayName: Mumble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.kitlangton.hex.mobile.keyboard-session
            CFBundleURLSchemes:
              - mumble-dictation
        NSMicrophoneUsageDescription: Mumble records only while you dictate and transcribes locally on this iPhone.
        NSSpeechRecognitionUsageDescription: Mumble uses Apple's on-device SpeechTranscriber to turn your recording into text.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MumbleMobile/MumbleMobile.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile
        PRODUCT_NAME: Mumble
    scheme:
      gatherCoverageData: false
      testTargets:
        - MumbleMobileTests
  MumbleKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - MumbleKeyboard
      - MumbleShared
    info:
      path: MumbleKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Mumble Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: MumbleKeyboard/MumbleKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile.keyboard
        PRODUCT_NAME: MumbleKeyboard
        SKIP_INSTALL: YES
  MumbleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MumbleWidgets
      - MumbleActivity
      - MumbleShared/MumbleTheme.swift
    info:
      path: MumbleWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mumble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile.widgets
        PRODUCT_NAME: MumbleWidgets
        SKIP_INSTALL: YES
  MumbleMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MumbleMobileTests
      - path: ../tests/fixtures/vocabulary/audio/term-hex-1.wav
        buildPhase: resources
    dependencies:
      - target: MumbleMobile
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kitlangton.hex.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mumble.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mumble
